<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HostelCare - Warden Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>

<div class="shell">
  <header class="topbar">
    <div class="topbar-row">
      <a href="/" class="brand">
        <span class="brand-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7l8-4z"/></svg>
        </span>
        HostelCare
      </a>
      <div class="user-box">
        <strong id="userName">Warden</strong>
        <span id="userSub">Warden · Hostel B</span>
        <div class="topbar-actions">
          <button class="btn-sm" onclick="logout()">Log out</button>
        </div>
      </div>
    </div>
  </header>

  <div class="body-area">
    <nav class="rail" aria-label="Navigation">
      <button id="navEmergencies" class="active" onclick="switchWardenTab('emergencies')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3L2 20h20L12 3z"/><path d="M12 10v4"/><path d="M12 17h.01"/></svg>
        Emergencies
      </button>
      <button id="navRequests" onclick="switchWardenTab('requests')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
        Requests & Approvals
      </button>
    </nav>

    <main>
      <h1 class="page-title" id="pageTitle">Emergencies</h1>
      <div id="contentRoot"></div>
    </main>
  </div>

  <nav class="tabbar">
    <button id="mNavEmergencies" class="active" onclick="switchWardenTab('emergencies')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3L2 20h20L12 3z"/><path d="M12 10v4"/><path d="M12 17h.01"/></svg>
      Emergencies
    </button>
    <button id="mNavRequests" onclick="switchWardenTab('requests')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
      Requests
    </button>
  </nav>
</div>

<script src="/js/api.js"></script>
<script src="/js/warden.js"></script>
</body>
</html>
